<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FoodGraph</title>
</head>
<body>
<script>
(function () {
  var path = location.pathname.replace(/\/+$/, '');
  var match = path.match(/^\/(?:foodgraph\/)?r\/([^/]+)(?:\/([^/]+))?(?:\/([^/]+))?$/i);
  var projectBase = /\.github\.io$/i.test(location.hostname) ? '/foodgraph' : '';

  if (match) {
    localStorage.setItem('foodgraph_referrer_id', decodeURIComponent(match[1]));
    localStorage.setItem('foodgraph_source', decodeURIComponent(match[2] || 'direct'));
    localStorage.setItem('foodgraph_campaign', decodeURIComponent(match[3] || 'general'));
  }

  // Custom-domain Pages use the domain root; github.io project Pages use /foodgraph/.
  location.replace(projectBase + '/');
})();
</script>
</body>
</html>
